name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # the id "publish" is what the Home Assistant notification checks for success
  publish:
    name: Semantic Release
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Configure Git
        run: |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # the local action, not @v2: this repository releases the action itself
      - name: Semantic Release
        id: release
        uses: ./.github/actions/semantic-release
        with:
          github-token: ${{ github.token }}
          changelog: false

      # callers reference @v<major> and @v<major>.<minor>, both have to follow the new release
      - name: Move Floating Tags
        if: steps.release.outputs.released == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
              set -euo pipefail

              if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
                echo "Not a stable version: $VERSION, floating tags stay"
                exit 0
              fi

              major="v${BASH_REMATCH[1]}"
              minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

              git tag -f "$major" "v$VERSION^{commit}"
              git tag -f "$minor" "v$VERSION^{commit}"
              git push --force origin "refs/tags/$major" "refs/tags/$minor"

              echo "### Floating tags" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$major\` and \`$minor\` point to \`v$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify Home Assistant

    needs: [publish]

    if: ${{ always() }}

    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      # the local action needs the repository, like the release above it does not use @v2
      - name: Checkout
        uses: actions/checkout@v6

      - name: Send Notification
        uses: ./.github/actions/homeassistant-notify
        with:
          webhook_url: ${{ secrets.HOMEASSISTANT_WEBHOOK_URL }}
          job_results: ${{ toJSON(needs) }}
          github_token: ${{ github.token }}
