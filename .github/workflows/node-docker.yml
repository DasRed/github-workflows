name: Node.js Docker CI/CD

on:
  workflow_call:
    inputs:
      node-version:
        type:    string
        default: '26'
        required: false

      deploy:
        type:    boolean
        default: true
        required: false

      environment:
        type:     string
        required: true

      container-name:
        type:     string
        required: false

    secrets:
      dockhand-host:
        required: true

      dockhand-token:
        required: true

      homeassistant-webhook-url:
        required: true

    outputs:
      released:
        description: '"true" if this run created a release and published the image, otherwise "false"'
        value:       ${{ jobs.publish.outputs.released }}

      version:
        description: Version of the release (package.json), empty without a release
        value:       ${{ jobs.publish.outputs.version }}

      image:
        description: Image name without tag, e.g. ghcr.io/owner/repo
        value:       ${{ jobs.publish.outputs.image }}

jobs:
  publish:
    name:    Test, Release & Publish
    runs-on: ubuntu-26.04

    permissions:
      contents:      write
      packages:      write
      issues:        write
      pull-requests: write

    outputs:
      image:    ${{ steps.metadata.outputs.image }}
      tags:     ${{ steps.metadata.outputs.tags }}
      released: ${{ steps.metadata.outputs.released }}
      version:  ${{ steps.metadata.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth:         0
          persist-credentials: true
          token:               ${{ github.token }}

      - name: Configure Git
        run:  |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache:        npm

      - name: Install
        run:  npm ci

      - name: Test
        run:  npm run test --if-present

      - name: Build
        run:  npm run build --if-present

      - name: Release
        if:   github.ref_name == 'main' || github.ref_name == 'master'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run:  npm run semantic-release --if-present

      - name:  Docker Metadata
        id:    metadata
        shell: bash
        run:   |
               set -euo pipefail
               
               IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
               VERSION=$(node -p "require('./package.json').version")
               
               echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
               echo "released=false" >> "$GITHUB_OUTPUT"
               
               if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                 echo "Not a stable version: $VERSION"
                 exit 0
               fi
               
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
               
               if ! git tag --points-at HEAD \
                 | grep -Fxq "v$VERSION"; then
                 echo "No release for version $VERSION"
                 exit 0
               fi
               
               {
                 echo "released=true"
                 echo "version=$VERSION"
               
                 echo "tags<<EOF"
                 echo "$IMAGE:$MAJOR"
                 echo "$IMAGE:$MAJOR.$MINOR"
                 echo "$IMAGE:$VERSION"
                 echo "$IMAGE:latest"
                 echo "EOF"
               } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        if:   steps.metadata.outputs.released == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if:   steps.metadata.outputs.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        if:   steps.metadata.outputs.released == 'true'
        uses: docker/build-push-action@v7
        with:
          context:    .
          file:       ./Dockerfile
          push:       true
          platforms:  linux/amd64,linux/arm64
          tags:       ${{ steps.metadata.outputs.tags }}
          labels:     |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy:
    name:    Deploy via Dockhand
    runs-on: ubuntu-26.04
    needs:   publish

    permissions: { }

    if:      needs.publish.outputs.released == 'true' && inputs.deploy

    steps:
      - name: Update Container
        uses: DasRed/github-workflows/.github/actions/dockhand-update@v1
        with:
          host:           ${{ secrets.dockhand-host }}
          token:          ${{ secrets.dockhand-token }}
          environment:    ${{ inputs.environment }}
          container_name: ${{ inputs.container-name || github.event.repository.name }}
          image:          ${{ needs.publish.outputs.image }}:latest

  notify:
    name: Notify Home Assistant

    needs: [publish, deploy]

    if: ${{ always() }}

    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Send Notification
        uses: DasRed/github-workflows/.github/actions/homeassistant-notify@v1
        with:
          webhook_url: ${{ secrets.homeassistant-webhook-url }}
          job_results: ${{ toJSON(needs) }}
          github_token: ${{ github.token }}
