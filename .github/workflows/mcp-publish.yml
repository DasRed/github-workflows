name: MCP Server CI/CD

on:
  workflow_call:
    inputs:
      environment:
        type:     string
        required: true

      container-name:
        type:     string
        required: false

      node-version:
        type:     string
        default:  '26'
        required: false

      deploy:
        type:     boolean
        default:  true
        required: false

      changelog:
        description: Maintain CHANGELOG.md in the repository (built-in semantic-release only)
        type:        boolean
        default:     true
        required:    false

      release-docs:
        description: Release a patch for docs commits (built-in semantic-release only)
        type:        boolean
        default:     false
        required:    false

      backmerge-branch:
        description: Branch that gets the release merged back, skipped if it does not exist, empty disables it (built-in semantic-release only)
        type:        string
        default:     develop
        required:    false

      server-file:
        description: Path of the server.json file in the repository
        type:        string
        default:     server.json
        required:    false

      publisher-version:
        description: Release tag of mcp-publisher (github.com/modelcontextprotocol/registry)
        type:        string
        default:     v1.8.13
        required:    false

    secrets:
      dockhand-host:
        required: true

      dockhand-token:
        required: true

      homeassistant-webhook-url:
        required: true

    outputs:
      released:
        description: '"true" if this run created a release and published the image, otherwise "false"'
        value:       ${{ jobs.publish.outputs.released }}

      version:
        description: Version of the release (package.json), empty without a release
        value:       ${{ jobs.publish.outputs.version }}

      image:
        description: Image name without tag, e.g. ghcr.io/owner/repo
        value:       ${{ jobs.publish.outputs.image }}

jobs:
  # test, release, image and deployment are the same as for every Docker project
  publish:
    name: Node.js Docker

    permissions:
      contents:      write
      packages:      write
      issues:        write
      pull-requests: write

    uses: DasRed/github-workflows/.github/workflows/node-docker.yml@v2
    secrets:
      dockhand-host:             ${{ secrets.dockhand-host }}
      dockhand-token:            ${{ secrets.dockhand-token }}
      homeassistant-webhook-url: ${{ secrets.homeassistant-webhook-url }}
    with:
      environment:      ${{ inputs.environment }}
      container-name:   ${{ inputs.container-name }}
      node-version:     ${{ inputs.node-version }}
      deploy:           ${{ inputs.deploy }}
      changelog:        ${{ inputs.changelog }}
      release-docs:     ${{ inputs.release-docs }}
      backmerge-branch: ${{ inputs.backmerge-branch }}
      notify:           false

  mcp-registry:
    name:    Publish to MCP Registry
    runs-on: ubuntu-26.04
    needs:   publish

    # the image is published even if only the deployment failed, so the registry entry is still possible
    if:      ${{ !cancelled() && needs.publish.outputs.released == 'true' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.publish.outputs.version }}

      - name:  Check Version
        shell: bash
        env:
          VERSION:     ${{ needs.publish.outputs.version }}
          SERVER_FILE: ${{ inputs.server-file }}
        run:   |
               set -euo pipefail

               if [[ ! -f "$SERVER_FILE" ]]; then
                 echo "::error::$SERVER_FILE not found"
                 exit 1
               fi

               # semantic-release sets the version in the release commit, the tag v<version> must contain it
               actual=$(jq -r .version "$SERVER_FILE")
               if [[ "$actual" != "$VERSION" ]]; then
                 echo "::error::$SERVER_FILE has version \"$actual\", expected \"$VERSION\". Is server.json updated and committed by semantic-release?"
                 exit 1
               fi

               jq -r --arg v "$VERSION" '.packages[]? | select(.registryType == "oci" and (.identifier | endswith(":" + $v) | not)) | .identifier' "$SERVER_FILE" \
                 | while read -r identifier; do
                     echo "::error::Image $identifier does not use the tag $VERSION"
                     exit 1
                   done

               echo "### MCP Registry" >> "$GITHUB_STEP_SUMMARY"
               echo "" >> "$GITHUB_STEP_SUMMARY"
               echo "\`$(jq -r .name "$SERVER_FILE")\` version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
               jq -r '.packages[]? | "- `\(.identifier)`"' "$SERVER_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name:  Install mcp-publisher
        shell: bash
        env:
          PUBLISHER_VERSION: ${{ inputs.publisher-version }}
        run:   |
               set -euo pipefail

               archive="mcp-publisher_linux_amd64.tar.gz"
               base_url="https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION"

               curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base_url/$archive"
               curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sigstore.json" "$base_url/$archive.sigstore.json"

               cosign verify-blob \
                 --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
                 --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$PUBLISHER_VERSION" \
                 --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                 "$RUNNER_TEMP/$archive"

               tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
               echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Login
        run:  mcp-publisher login github-oidc

      - name: Publish
        env:
          SERVER_FILE: ${{ inputs.server-file }}
        run:  mcp-publisher publish "$SERVER_FILE"

  notify:
    name: Notify Home Assistant

    needs: [publish, mcp-registry]

    if: ${{ always() }}

    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Send Notification
        uses: DasRed/github-workflows/.github/actions/homeassistant-notify@v2
        with:
          webhook_url: ${{ secrets.homeassistant-webhook-url }}
          job_results: ${{ toJSON(needs) }}
          github_token: ${{ github.token }}
